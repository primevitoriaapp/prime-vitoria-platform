# Smoke contra preview Vercel (PRs feature). Requer secrets no repositório.
# Secrets: STAGING_BASE_URL (ou deixar vazio para usar comentário Vercel), STAGING_E2E_PASSWORD,
#          NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY,
#          VERCEL_AUTOMATION_BYPASS_SECRET

name: Preview PR smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL do preview (override)"
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  preview-smoke:
    if: github.event_name == 'workflow_dispatch' || github.head_ref != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - name: Resolve preview BASE_URL
        id: preview_url
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.base_url }}" ]; then
            echo "url=${{ inputs.base_url }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.STAGING_BASE_URL }}" ]; then
            echo "url=${{ secrets.STAGING_BASE_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=$(node scripts/resolve-vercel-preview-url.mjs)" >> "$GITHUB_OUTPUT"
          fi
      - name: Night preview smoke (staging APIs)
        env:
          BASE_URL: ${{ steps.preview_url.outputs.url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          missing=""
          [ -z "$BASE_URL" ] && missing="$missing STAGING_BASE_URL"
          [ -z "$STAGING_E2E_PASSWORD" ] && missing="$missing STAGING_E2E_PASSWORD"
          [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] && missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ] && missing="$missing VERCEL_AUTOMATION_BYPASS_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Preview smoke não configurado — secrets em falta:$missing"
            echo "Ver docs/STAGING_PREVIEW_OFFICIAL.md"
            exit 1
          fi
          node scripts/night-preview-smoke.mjs
