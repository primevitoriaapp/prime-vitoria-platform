name: Consulta versões (temporário)
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-npm.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in @capacitor/core @capacitor/android @capacitor/cli @capacitor-community/background-geolocation @capacitor/push-notifications; do echo "== $p"; npm view $p dist-tags --json; done
          npm view @capacitor-community/background-geolocation@latest peerDependencies --json
