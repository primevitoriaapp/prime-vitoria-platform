name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSJ9.ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.service-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm start &
      - name: Wait for server and run HTTP smoke
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              npm run test:e2e-smoke
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in time"
          exit 1

  playwright:
    runs-on: ubuntu-latest
    needs: test-and-build
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
      TRUST_HEADER_AUTH: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npm start &
      - name: Playwright E2E
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              npm run test:e2e-playwright
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in time"
          exit 1
